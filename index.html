<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 421 Type Inferencer Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14171c; --panel: #1b1f26; --ink: #e3e7ee; --muted: #8b95a7; --line: #2c323c;
    --accent: #2f5fb3; --orange: #e8673f; --pass: #4cc38a; --pass-bg: #173226;
    --fail: #f06a5f; --fail-bg: #35191a; --code-bg: #232831; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); background: var(--bg); font-size: 15px; }
  header { background: #0e1116; border-bottom: 1px solid var(--line); color: #fff; padding: 10px 20px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  header .total { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 14px; }
  header .status { font-size: 13px; opacity: .85; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #f5b041; margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: #58d68d; }
  .wrap { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 44px); }
  nav { background: var(--panel); border-right: 1px solid var(--line); padding: 12px 0; }
  nav button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 9px 16px; text-align: left; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  nav button:hover { background: var(--bg); }
  nav button.active { background: #232a35; border-left: 3px solid var(--orange); padding-left: 13px; font-weight: 500; }
  nav .num { color: var(--muted); font-family: "JetBrains Mono", monospace; font-size: 12px; width: 18px; }
  nav .badge { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 11px; padding: 2px 6px; border-radius: 10px; background: var(--code-bg); color: var(--muted); }
  nav .badge.full { background: var(--pass-bg); color: var(--pass); }
  nav .badge.part { background: #3a2c12; color: #f0b44c; }
  nav .resetall { margin: 14px 16px 0; width: calc(100% - 32px); justify-content: center; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font-size: 13px; }
  main { padding: 20px 28px 60px; max-width: 1100px; min-width: 0; }
  .wrap.collapsed { grid-template-columns: 1fr; }
  .wrap.collapsed nav { display: none; }
  .navtoggle { border: 1px solid var(--line); background: none; color: var(--ink); border-radius: 6px; padding: 3px 9px; font-size: 15px; cursor: pointer; }
  .navtoggle:hover { border-color: #3d4552; }
  .qhead { display: flex; align-items: baseline; gap: 12px; }
  h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
  .ctor { font-family: "JetBrains Mono", monospace; font-size: 13px; color: var(--muted); }
  h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 0 8px; font-weight: 600; }
  pre { font-family: "JetBrains Mono", monospace; font-size: 13px; line-height: 1.45; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; margin: 0; overflow-x: auto; }
  pre.rule { background: var(--panel); }
  .note { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  code { font-family: "JetBrains Mono", monospace; font-size: 12.5px; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 14px; margin: 10px 0 6px; }
  .editor { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #282c34; }
  .editor .cm-editor { height: 440px; font-size: 13.5px; }
  .editor .cm-scroller { font-family: "JetBrains Mono", monospace; }
  .editor.sol .cm-editor { height: auto; }
  .actions { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 14px; border-radius: 6px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
  .btn.primary:hover { background: #3a6fcc; }
  .btn:hover { border-color: #3d4552; }
  .btn.primary:disabled { opacity: .5; cursor: default; }
  .btn.danger { color: var(--fail); }
  .hint { font-size: 12.5px; color: var(--muted); }
  .score { margin-top: 18px; padding: 14px 16px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; gap: 16px; }
  .score .big { font-size: 26px; font-weight: 600; font-family: "JetBrains Mono", monospace; }
  .bar { flex: 1; height: 8px; background: var(--code-bg); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--pass); transition: width .3s; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--code-bg); font-weight: 600; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  td.m { font-family: "JetBrains Mono", monospace; font-size: 12.5px; }
  tr.pass td.st { color: var(--pass); font-weight: 600; }
  tr.fail { background: var(--fail-bg); }
  tr.fail td.st { color: var(--fail); font-weight: 600; }
  pre.out { background: #0f1115; color: #e6e6e6; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  pre.out.err { border-color: var(--fail); }
  .scratch textarea { width: 100%; height: 90px; font-family: "JetBrains Mono", monospace; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; background: var(--code-bg); color: var(--ink); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal.show { display: flex; }
  .modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; max-width: 380px; }
  .modal .box p { margin: 0 0 16px; }
  .pages { display: flex; gap: 6px; margin: 0 12px 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .pages a { flex: 1; text-align: center; padding: 6px 4px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 13px; }
  .pages a:hover { color: var(--ink); }
  .pages a.cur { color: var(--ink); background: #232a35; border-color: #3d4552; font-weight: 500; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--line); } main { padding: 16px; } }
</style>

<script>
const QUESTIONS = [{"id":"VarExp","title":"Variables","ctor":"VarExp x","rule":"\n  ─────────────────────────────────────────────  (Var)\n   Γ ⊢ x : τ | unify{(τ, freshInstance(Γ(x)))}\n\n  if Γ(x) is not defined, inference fails (None).","note":"Look x up with <code>lookup_env gamma x</code>. It returns a <code>polyTy option</code>; instantiate with <code>freshInstance</code> so polymorphic bindings get fresh type variables each use.","sol":"| VarExp x ->\n    (match lookup_env gamma x with\n     | None -> None\n     | Some pty ->\n       (match unify [(tau, freshInstance pty)] with\n        | None -> None\n        | Some sigma -> Some (Proof ([], judgment), sigma)))","sample":"# print_string (niceInfer_exp gather_exp_ty_substitution gamma (* = {x : int} *)\n    (x));;\n{x : int} |= x : 'b\n\n\nUnifying substitution: ['b --> int]\nSubstituting...\n\n{x : int} |= x : int\n","starter":"open Common\n\nlet rec gather_exp_ty_substitution gamma exp tau =\n    let judgment = ExpJudgment(gamma, exp, tau) in\n    match exp\n    with ConstExp c ->\n         let tau' = const_signature c in\n         (match unify [(tau, freshInstance tau')]\n          with None       -> None\n             | Some sigma -> Some(Proof([],judgment), sigma))\n\n    (* Implement the VarExp case here:  VarExp x  *)\n\n    | _ -> provided_cases gather_exp_ty_substitution gamma exp tau\n"},{"id":"MonOpAppExp","title":"Unary operators","ctor":"MonOpAppExp (mon_op, e)","rule":"\n          Γ ⊢ e : τ₁ | σ\n  ──────────────────────────────────────────────────────────  (MonOp)\n   Γ ⊢ ⊕ e : τ | unify{(σ(τ₁ → τ), freshInstance(sig(⊕)))} ∘ σ\n\n  τ₁ fresh;  sig(⊕) = monop_signature ⊕","note":"One subproof. The operator's type comes from <code>monop_signature</code>.","sol":"| MonOpAppExp (monop, e1) ->\n    let tau1 = fresh () in\n    (match gather_exp_ty_substitution gamma e1 tau1 with\n     | None -> None\n     | Some (pf1, sigma1) ->\n       (match unify [(monoTy_lift_subst sigma1 (mk_fun_ty tau1 tau),\n                      freshInstance (monop_signature monop))] with\n        | None -> None\n        | Some sigma2 -> Some (Proof ([pf1], judgment), subst_compose sigma2 sigma1)))","sample":"# print_string (niceInfer_exp gather_exp_ty_substitution []\n    (~ 42));;\n{} |= ~ 42 : 'b\n |--{} |= 42 : 'c\n\n\nUnifying substitution: ['b --> int; 'c --> int]\nSubstituting...\n\n{} |= ~ 42 : int\n |--{} |= 42 : int\n","starter":"open Common\n\nlet rec gather_exp_ty_substitution gamma exp tau =\n    let judgment = ExpJudgment(gamma, exp, tau) in\n    match exp\n    with ConstExp c ->\n         let tau' = const_signature c in\n         (match unify [(tau, freshInstance tau')]\n          with None       -> None\n             | Some sigma -> Some(Proof([],judgment), sigma))\n\n    (* Implement the MonOpAppExp case here:  MonOpAppExp (mon_op, e)  *)\n\n    | _ -> provided_cases gather_exp_ty_substitution gamma exp tau\n"},{"id":"BinOpAppExp","title":"Binary operators","ctor":"BinOpAppExp (bin_op, e1, e2)","rule":"\n   Γ ⊢ e₁ : τ₁ | σ₁        σ₁(Γ) ⊢ e₂ : τ₂ | σ₂\n  ────────────────────────────────────────────────────────────────────────  (BinOp)\n   Γ ⊢ e₁ ⊕ e₂ : τ | unify{(σ₂∘σ₁(τ₁ → τ₂ → τ), freshInstance(sig(⊕)))} ∘ σ₂ ∘ σ₁\n\n  τ₁, τ₂ fresh;  sig(⊕) = binop_signature ⊕","note":"Thread σ₁ into the environment for e₂. Apply the composed σ₂∘σ₁ to τ₁ → τ₂ → τ before unifying.","sol":"| BinOpAppExp (binop, e1, e2) ->\n    let tau1 = fresh () in\n    let tau2 = fresh () in\n    (match gather_exp_ty_substitution gamma e1 tau1 with\n     | None -> None\n     | Some (pf1, sigma1) ->\n       (match gather_exp_ty_substitution (env_lift_subst sigma1 gamma) e2 tau2 with\n        | None -> None\n        | Some (pf2, sigma2) ->\n          let sigma21 = subst_compose sigma2 sigma1 in\n          (match unify [(monoTy_lift_subst sigma21 (mk_fun_ty tau1 (mk_fun_ty tau2 tau)),\n                         freshInstance (binop_signature binop))] with\n           | None -> None\n           | Some sigma3 ->\n             Some (Proof ([pf1; pf2], judgment), subst_compose sigma3 sigma21))))","sample":"# print_string (niceInfer_exp gather_exp_ty_substitution []\n    (1 + 2));;\n{} |= 1 + 2 : 'b\n |--{} |= 1 : 'c\n |--{} |= 2 : 'd\n\n\nUnifying substitution: ['b --> int; 'd --> int; 'c --> int]\nSubstituting...\n\n{} |= 1 + 2 : int\n |--{} |= 1 : int\n |--{} |= 2 : int\n","starter":"open Common\n\nlet rec gather_exp_ty_substitution gamma exp tau =\n    let judgment = ExpJudgment(gamma, exp, tau) in\n    match exp\n    with ConstExp c ->\n         let tau' = const_signature c in\n         (match unify [(tau, freshInstance tau')]\n          with None       -> None\n             | Some sigma -> Some(Proof([],judgment), sigma))\n\n    (* Implement the BinOpAppExp case here:  BinOpAppExp (bin_op, e1, e2)  *)\n\n    | _ -> provided_cases gather_exp_ty_substitution gamma exp tau\n"},{"id":"IfExp","title":"If-then-else","ctor":"IfExp (e1, e2, e3)","rule":"\n   Γ ⊢ e₁ : bool | σ₁    σ₁(Γ) ⊢ e₂ : σ₁(τ) | σ₂    σ₂∘σ₁(Γ) ⊢ e₃ : σ₂∘σ₁(τ) | σ₃\n  ─────────────────────────────────────────────────────────────────────────────  (If)\n   Γ ⊢ if e₁ then e₂ else e₃ : τ | σ₃ ∘ σ₂ ∘ σ₁","note":"No unify call of your own: the constraints are pushed into the recursive calls. Three subproofs.","sol":"| IfExp (e1, e2, e3) ->\n    (match gather_exp_ty_substitution gamma e1 bool_ty with\n     | None -> None\n     | Some (pf1, sigma1) ->\n       (match gather_exp_ty_substitution (env_lift_subst sigma1 gamma) e2\n                (monoTy_lift_subst sigma1 tau) with\n        | None -> None\n        | Some (pf2, sigma2) ->\n          let sigma21 = subst_compose sigma2 sigma1 in\n          (match gather_exp_ty_substitution (env_lift_subst sigma21 gamma) e3\n                   (monoTy_lift_subst sigma21 tau) with\n           | None -> None\n           | Some (pf3, sigma3) ->\n             Some (Proof ([pf1; pf2; pf3], judgment), subst_compose sigma3 sigma21))))","sample":"# print_string (niceInfer_exp gather_exp_ty_substitution []\n    (if true then 1 else 2));;\n{} |= if true then 1 else 2 : 'b\n |--{} |= true : bool\n |--{} |= 1 : 'b\n |--{} |= 2 : int\n\n\nUnifying substitution: ['b --> int]\nSubstituting...\n\n{} |= if true then 1 else 2 : int\n |--{} |= true : bool\n |--{} |= 1 : int\n |--{} |= 2 : int\n","starter":"open Common\n\nlet rec gather_exp_ty_substitution gamma exp tau =\n    let judgment = ExpJudgment(gamma, exp, tau) in\n    match exp\n    with ConstExp c ->\n         let tau' = const_signature c in\n         (match unify [(tau, freshInstance tau')]\n          with None       -> None\n             | Some sigma -> Some(Proof([],judgment), sigma))\n\n    (* Implement the IfExp case here:  IfExp (e1, e2, e3)  *)\n\n    | _ -> provided_cases gather_exp_ty_substitution gamma exp tau\n"},{"id":"FunExp","title":"Functions","ctor":"FunExp (x, e)","rule":"\n          [x : τ₁] + Γ ⊢ e : τ₂ | σ\n  ─────────────────────────────────────────────────────  (Fun)\n   Γ ⊢ fun x -> e : τ | unify{(σ(τ), σ(τ₁ → τ₂))} ∘ σ\n\n  τ₁, τ₂ fresh;  x is bound monomorphically (polyTy_of_monoTy τ₁)","note":"Extend the environment with <code>ins_env gamma x (polyTy_of_monoTy tau1)</code>. Do NOT generalize here.","sol":"| FunExp (x, e) ->\n    let tau1 = fresh () in\n    let tau2 = fresh () in\n    (match gather_exp_ty_substitution (ins_env gamma x (polyTy_of_monoTy tau1)) e tau2 with\n     | None -> None\n     | Some (pf, sigma) ->\n       (match unify [(monoTy_lift_subst sigma tau,\n                      monoTy_lift_subst sigma (mk_fun_ty tau1 tau2))] with\n        | None -> None\n        | Some sigma' -> Some (Proof ([pf], judgment), subst_compose sigma' sigma)))","sample":"# print_string (niceInfer_exp gather_exp_ty_substitution []\n    (fun x -> x));;\n{} |= fun x -> x : 'b\n |--{x : 'c} |= x : 'd\n\n\nUnifying substitution: ['b --> 'c -> 'c; 'd --> 'c]\nSubstituting...\n\n{} |= fun x -> x : 'c -> 'c\n |--{x : 'c} |= x : 'c\n","starter":"open Common\n\nlet rec gather_exp_ty_substitution gamma exp tau =\n    let judgment = ExpJudgment(gamma, exp, tau) in\n    match exp\n    with ConstExp c ->\n         let tau' = const_signature c in\n         (match unify [(tau, freshInstance tau')]\n          with None       -> None\n             | Some sigma -> Some(Proof([],judgment), sigma))\n\n    (* Implement the FunExp case here:  FunExp (x, e)  *)\n\n    | _ -> provided_cases gather_exp_ty_substitution gamma exp tau\n"},{"id":"AppExp","title":"Application","ctor":"AppExp (e1, e2)","rule":"\n   Γ ⊢ e₁ : τ₁ → τ | σ₁        σ₁(Γ) ⊢ e₂ : σ₁(τ₁) | σ₂\n  ─────────────────────────────────────────────────────  (App)\n   Γ ⊢ e₁ e₂ : τ | σ₂ ∘ σ₁\n\n  τ₁ fresh","note":"The function is checked against τ₁ → τ directly, so no extra unify.","sol":"| AppExp (e1, e2) ->\n    let tau1 = fresh () in\n    (match gather_exp_ty_substitution gamma e1 (mk_fun_ty tau1 tau) with\n     | None -> None\n     | Some (pf1, sigma1) ->\n       (match gather_exp_ty_substitution (env_lift_subst sigma1 gamma) e2\n                (monoTy_lift_subst sigma1 tau1) with\n        | None -> None\n        | Some (pf2, sigma2) -> Some (Proof ([pf1; pf2], judgment), subst_compose sigma2 sigma1)))","sample":"# print_string (niceInfer_exp gather_exp_ty_substitution []\n    ((fun x -> x) 1));;\n{} |= (fun x -> x) 1 : 'b\n |--{} |= fun x -> x : 'c -> 'b\n    |--{x : 'd} |= x : 'e\n |--{} |= 1 : 'd\n\n\nUnifying substitution: ['d --> int; 'b --> int; 'c --> int; 'e --> int]\nSubstituting...\n\n{} |= (fun x -> x) 1 : int\n |--{} |= fun x -> x : int -> int\n    |--{x : int} |= x : int\n |--{} |= 1 : int\n","starter":"open Common\n\nlet rec gather_exp_ty_substitution gamma exp tau =\n    let judgment = ExpJudgment(gamma, exp, tau) in\n    match exp\n    with ConstExp c ->\n         let tau' = const_signature c in\n         (match unify [(tau, freshInstance tau')]\n          with None       -> None\n             | Some sigma -> Some(Proof([],judgment), sigma))\n\n    (* Implement the AppExp case here:  AppExp (e1, e2)  *)\n\n    | _ -> provided_cases gather_exp_ty_substitution gamma exp tau\n"},{"id":"LetInExp","title":"Let","ctor":"LetInExp (x, e1, e)","rule":"\n   Γ ⊢ e₁ : τ₁ | σ₁     [x : GEN(σ₁(Γ), σ₁(τ₁))] + σ₁(Γ) ⊢ e : σ₁(τ) | σ₂\n  ────────────────────────────────────────────────────────────────────  (Let)\n   Γ ⊢ let x = e₁ in e : τ | σ₂ ∘ σ₁\n\n  τ₁ fresh;  GEN = gen","note":"Generalize w.r.t. the <em>substituted</em> environment σ₁(Γ), not Γ. That is what makes <code>fun y -> let f = fun x -> y in (f 1, f true)</code> come out right.","sol":"| LetInExp (x, e1, e) ->\n    let tau1 = fresh () in\n    (match gather_exp_ty_substitution gamma e1 tau1 with\n     | None -> None\n     | Some (pf1, sigma1) ->\n       let gamma1 = env_lift_subst sigma1 gamma in\n       (match gather_exp_ty_substitution\n                (ins_env gamma1 x (gen gamma1 (monoTy_lift_subst sigma1 tau1))) e\n                (monoTy_lift_subst sigma1 tau) with\n        | None -> None\n        | Some (pf2, sigma2) -> Some (Proof ([pf1; pf2], judgment), subst_compose sigma2 sigma1)))","sample":"# print_string (niceInfer_exp gather_exp_ty_substitution []\n    (let x = 1 in x));;\n{} |= let x = 1 in x : 'b\n |--{} |= 1 : 'c\n |--{x : int} |= x : 'b\n\n\nUnifying substitution: ['b --> int; 'c --> int]\nSubstituting...\n\n{} |= let x = 1 in x : int\n |--{} |= 1 : int\n |--{x : int} |= x : int\n","starter":"open Common\n\nlet rec gather_exp_ty_substitution gamma exp tau =\n    let judgment = ExpJudgment(gamma, exp, tau) in\n    match exp\n    with ConstExp c ->\n         let tau' = const_signature c in\n         (match unify [(tau, freshInstance tau')]\n          with None       -> None\n             | Some sigma -> Some(Proof([],judgment), sigma))\n\n    (* Implement the LetInExp case here:  LetInExp (x, e1, e)  *)\n\n    | _ -> provided_cases gather_exp_ty_substitution gamma exp tau\n"},{"id":"LetRecInExp","title":"Let rec","ctor":"LetRecInExp (f, x, e1, e)","rule":"\n   [x : τ₁] + [f : τ₁ → τ₂] + Γ ⊢ e₁ : τ₂ | σ₁\n   [f : GEN(σ₁(Γ), σ₁(τ₁ → τ₂))] + σ₁(Γ) ⊢ e : σ₁(τ) | σ₂\n  ─────────────────────────────────────────────────────  (LetRec)\n   Γ ⊢ let rec f x = e₁ in e : τ | σ₂ ∘ σ₁\n\n  τ₁, τ₂ fresh;  inside e₁, f and x are monomorphic","note":"Inside the body e₁, <code>f</code> is monomorphic, so <code>let rec f x = f 1 in f true</code> must fail. Only generalize for e.","sol":"| LetRecInExp (f, x, e1, e) ->\n    let tau1 = fresh () in\n    let tau2 = fresh () in\n    (match gather_exp_ty_substitution\n             (ins_env (ins_env gamma f (polyTy_of_monoTy (mk_fun_ty tau1 tau2)))\n                x (polyTy_of_monoTy tau1)) e1 tau2 with\n     | None -> None\n     | Some (pf1, sigma1) ->\n       let gamma1 = env_lift_subst sigma1 gamma in\n       (match gather_exp_ty_substitution\n                (ins_env gamma1 f (gen gamma1 (monoTy_lift_subst sigma1 (mk_fun_ty tau1 tau2)))) e\n                (monoTy_lift_subst sigma1 tau) with\n        | None -> None\n        | Some (pf2, sigma2) -> Some (Proof ([pf1; pf2], judgment), subst_compose sigma2 sigma1)))","sample":"# print_string (niceInfer_exp gather_exp_ty_substitution []\n    (let rec f x = f x in f));;\n{} |= let rec f x = f x in f : 'b\n |--{x : 'c, f : 'c -> 'd} |= f x : 'd\n    |--{x : 'c, f : 'c -> 'd} |= f : 'e -> 'd\n    |--{x : 'c, f : 'c -> 'd} |= x : 'c\n |--{f : forall 'c 'd. 'c -> 'd} |= f : 'b\n\n\nUnifying substitution: ['b --> 'g -> 'f; 'e --> 'c]\nSubstituting...\n\n{} |= let rec f x = f x in f : 'g -> 'f\n |--{x : 'c, f : 'c -> 'd} |= f x : 'd\n    |--{x : 'c, f : 'c -> 'd} |= f : 'c -> 'd\n    |--{x : 'c, f : 'c -> 'd} |= x : 'c\n |--{f : forall 'c 'd. 'c -> 'd} |= f : 'g -> 'f\n","starter":"open Common\n\nlet rec gather_exp_ty_substitution gamma exp tau =\n    let judgment = ExpJudgment(gamma, exp, tau) in\n    match exp\n    with ConstExp c ->\n         let tau' = const_signature c in\n         (match unify [(tau, freshInstance tau')]\n          with None       -> None\n const COMPLETIONS = [["fresh","unit -> monoTy"],["freshInstance","polyTy -> monoTy"],["unify","(monoTy * monoTy) list -> substitution option"],["monoTy_lift_subst","substitution -> monoTy -> monoTy"],["polyTy_lift_subst","substitution -> polyTy -> polyTy"],["env_lift_subst","substitution -> type_env -> type_env"],["subst_compose","s2 -> s1 -> (apply s1 then s2)"],["gen","type_env -> monoTy -> polyTy"],["polyTy_of_monoTy","monoTy -> polyTy"],["lookup_env","'a env -> string -> 'a option"],["ins_env","'a env -> string -> 'a -> 'a env"],["make_env","string -> 'a -> 'a env"],["sum_env","'a env -> 'a env -> 'a env"],["const_signature","const -> polyTy"],["binop_signature","bin_op -> polyTy"],["monop_signature","mon_op -> polyTy"],["mk_fun_ty","monoTy -> monoTy -> monoTy"],["mk_pair_ty","monoTy -> monoTy -> monoTy"],["mk_list_ty","monoTy -> monoTy"],["bool_ty","monoTy"],["int_ty","monoTy"],["float_ty","monoTy"],["string_ty","monoTy"],["unit_ty","monoTy"],["gather_exp_ty_substitution","type_env -> exp -> monoTy -> (proof * substitution) option"],["provided_cases","the other (pre-compiled) cases"],["infer_exp","gather -> type_env -> exp -> (monoTy * proof) option"],["niceInfer_exp","gather -> type_env -> exp -> string"],["string_of_proof","proof -> string"],["string_of_monoTy","monoTy -> string"],["string_of_exp","exp -> string"],["print_string","string -> unit"],["get_ty","result -> monoTy"],["get_proof","result -> proof"],["judgment","ExpJudgment(gamma, exp, tau)"],["gamma","type_env"],["tau","monoTy"],["Proof","constructor: proof list * judgment"],["ExpJudgment","constructor"],["TyVar","constructor: typeVar"],["TyConst","constructor: string * monoTy list"],["Some","constructor"],["None","constructor"],["VarExp","exp constructor"],["ConstExp","exp constructor"],["MonOpAppExp","exp constructor"],["BinOpAppExp","exp constructor"],["IfExp","exp constructor"],["AppExp","exp constructor"],["FunExp","exp constructor"],["LetInExp","exp constructor"],["LetRecInExp","exp constructor"],["RaiseExp","exp constructor"],["TryWithExp","exp constructor"],["IntConst","const constructor"],["BoolConst","const constructor"],["FloatConst","const constructor"],["StringConst","const constructor"],["NilConst","const constructor"],["UnitConst","const constructor"],["IntNegOp","mon_op"],["HdOp","mon_op"],["TlOp","mon_op"],["FstOp","mon_op"],["SndOp","mon_op"],["IntPlusOp","bin_op"],["IntMinusOp","bin_op"],["IntTimesOp","bin_op"],["IntDivOp","bin_op"],["FloatPlusOp","bin_op"],["FloatMinusOp","bin_op"],["FloatTimesOp","bin_op"],["FloatDivOp","bin_op"],["ConcatOp","bin_op"],["ConsOp","bin_op"],["CommaOp","bin_op"],["EqOp","bin_op"],["GreaterOp","bin_op"],["match","keyword"],["with","keyword"],["let","keyword"],["rec","keyword"],["in","keyword"],["fun","keyword"],["function","keyword"],["if","keyword"],["then","keyword"],["else","keyword"],["begin","keyword"],["end","keyword"],["List.rev","'a list -> 'a list"],["List.map","('a -> 'b) -> 'a list -> 'b list"],["List.fold_left","('a -> 'b -> 'a) -> 'a -> 'b list -> 'a"]];

// ---------- storage (best-effort) ----------
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("pe32:" + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("pe32:" + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("pe32:" + k); } catch (e) {} },
};
const state = {};
for (const q of QUESTIONS) {
  state[q.id] = store.get("q:" + q.id) || { code: q.starter, results: null, score: null };
}
let current = (location.hash && QUESTIONS.find(q => "#" + q.id === location.hash)) ? location.hash.slice(1) : QUESTIONS[0].id;

// ---------- OCaml worker ----------
let worker, ready = false, pending = new Map(), nextId = 1, readyWaiters = [];
function startWorker() {
  ready = false;
  setStatus(false, "Loading OCaml toplevel…");
  worker = new Worker("worker.js");
  worker.onmessage = (ev) => {
    const m = ev.data;
    if (m.type === "ready") {
      ready = true; setStatus(true, "OCaml 4.14 ready");
      readyWaiters.splice(0).forEach(f => f());
    } else if (m.type === "result") {
      const p = pending.get(m.id); pending.delete(m.id);
      if (p) { clearTimeout(p.timer); p.resolve(m.out); }
    }
  };
  worker.onerror = (e) => setStatus(false, "Worker error: " + (e.message || e));
}
function whenReady() { return ready ? Promise.resolve() : new Promise(r => readyWaiters.push(r)); }
async function ocaml(code, print, timeoutMs = 10000) {
  await whenReady();
  return new Promise((resolve) => {
    const id = nextId++;
    const timer = setTimeout(() => {
      pending.delete(id);
      worker.terminate(); startWorker();
      resolve("@@TIMEOUT");
    }, timeoutMs);
    pending.set(id, { resolve, timer });
    worker.postMessage({ id, code, print });
  });
}
function setStatus(ok, text) {
  document.getElementById("dot").className = "dot" + (ok ? " ok" : "");
  document.getElementById("statusText").textContent = text;
}

// ---------- rendering ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = `<div class="pages"><a href="index.html" class="cur">Inference</a><a href="lexer.html">Lexer</a><a href="regex.html">Regex</a></div>`;
  QUESTIONS.forEach((q, k) => {
    const st = state[q.id];
    const b = document.createElement("button");
    if (q.id === current) b.className = "active";
    let badge = "";
    if (st.score) {
      const cls = st.score.pass === st.score.total ? "full" : "part";
      badge = `<span class="badge ${cls}">${st.score.pass}/${st.score.total}</span>`;
    } else badge = `<span class="badge">–</span>`;
    b.innerHTML = `<span class="num">${k + 1}</span><span>${esc(q.title)}</span>${badge}`;
    b.onclick = () => { saveEditor(); current = q.id; try { history.replaceState(null, "", "#" + q.id); } catch (e) {} renderNav(); renderMain(); };
    nav.appendChild(b);
  });
  const ra = document.createElement("button");
  ra.className = "resetall"; ra.textContent = "Reset all questions";
  ra.onclick = () => confirmBox("Reset every question to its starting code and clear all scores?", () => {
    for (const q of QUESTIONS) { state[q.id] = { code: q.starter, results: null, score: null }; store.del("q:" + q.id); }
    renderNav(); renderMain();
  });
  nav.appendChild(ra);
  let p = 0, t = 0;
  for (const q of QUESTIONS) { const s = state[q.id].score; if (s) { p += s.pass; t += s.total; } }
  const done = QUESTIONS.filter(q => state[q.id].score && state[q.id].score.pass === state[q.id].score.total).length;
  document.getElementById("total").textContent = `${done}/${QUESTIONS.length} cases fully correct`;
}

let view = null;
function saveEditor() {
  if (view) { state[current].code = view.state.doc.toString(); store.set("q:" + current, state[current]); }
}

function completionSource(ctx) {
  const word = ctx.matchBefore(/[A-Za-z_][A-Za-z0-9_'.]*/);
  if (!word || (word.from === word.to && !ctx.explicit)) return null;
  return {
    from: word.from,
    options: COMPLETIONS.map(([label, detail]) => ({
      label, detail,
      type: /^[A-Z]/.test(label) ? (detail.includes("constructor") || detail.endsWith("op") || detail === "mon_op" || detail === "bin_op" ? "enum" : "function")
           : detail === "keyword" ? "keyword" : (detail.includes("->") ? "function" : "variable"),
    })),
    validFor: /^[A-Za-z0-9_'.]*$/,
  };
}

function renderMain() {
  const q = QUESTIONS.find(x => x.id === current);
  const st = state[q.id];
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="qhead"><h2>${esc(q.title)}</h2><span class="ctor">${esc(q.ctor)}</span></div>
    <h3>Problem</h3>
    <div>Implement the rule for <code>${esc(q.id)}</code> in <code>gather_exp_ty_substitution</code>. All other cases are provided as <code>provided_cases</code>.</div>
    <pre class="rule">${esc(q.rule.replace(/^\n/, ""))}</pre>
    <p class="note">${q.note}</p>
    <details><summary>Sample execution</summary><pre>${esc(q.sample)}</pre></details>
    <h3>Your code</h3>
    <div class="editor" id="editor"></div>
    <div class="actions">
      <button class="btn primary" id="grade">Save &amp; Grade</button>
      <button class="btn danger" id="reset">Reset question</button>
      <button class="btn" id="showSol">Show solution</button>
      <span class="hint">Tab accepts autocomplete · Ctrl-Space to open it · Ctrl/Cmd-Enter to grade</span>
    </div>
    <div class="editor sol" id="sol" style="display:none;margin-top:12px"></div>
    <div id="results"></div>
    <details class="scratch"><summary>Scratch toplevel: run your own expressions after your code is loaded</summary>
      <textarea id="scratch" spellcheck="false">print_string (niceInfer_exp gather_exp_ty_substitution [] (${esc(sampleExp(q))}));;</textarea>
      <div class="actions"><button class="btn" id="runScratch">Run (loads your code first)</button></div>
      <pre class="out" id="scratchOut" style="display:none;margin-top:8px"></pre>
    </details>`;

  const C = window.CM;
  view = new C.EditorView({
    parent: document.getElementById("editor"),
    state: C.EditorState.create({
      doc: st.code,
      extensions: [
        C.Prec.highest(C.keymap.of([
          { key: "Tab", run: C.acceptCompletion },
          { key: "Enter", run: (v) => {
              if (C.completionStatus(v.state) !== "active") return false;
              C.closeCompletion(v); return C.insertNewlineAndIndent(v); } },
        ])),
        C.basicSetup, C.keymap.of([C.indentWithTab, { key: "Mod-Enter", run: () => { grade(); return true; } }]),
        C.StreamLanguage.define(C.oCaml), C.oneDark,
        C.autocompletion({ override: [completionSource, C.completeAnyWord], activateOnTyping: true }),
        C.EditorView.updateListener.of(u => { if (u.docChanged) { clearTimeout(window.__sv); window.__sv = setTimeout(saveEditor, 400); } }),
      ],
    }),
  });

  document.getElementById("grade").onclick = grade;
  document.getElementById("reset").onclick = () => confirmBox(`Reset “${q.title}” to the starting code and clear its score?`, () => {
    state[q.id] = { code: q.starter, results: null, score: null }; store.del("q:" + q.id);
    renderNav(); renderMain();
  });
  document.getElementById("showSol").onclick = (e) => {
    const s = document.getElementById("sol");
    const show = s.style.display === "none";
    s.style.display = show ? "block" : "none";
    if (show && !s.firstChild) solView(s, q.sol, true);
    e.target.textContent = show ? "Hide solution" : "Show solution";
  };
  document.getElementById("runScratch").onclick = runScratch;
  renderResults();
}

function sampleExp(q) {
  const m = q.sample.match(/\n\s+\((.*)\)\);;/);
  return m ? m[1] : "";
}

function solView(parent, doc, lang) {
  const C = window.CM;
  return new C.EditorView({ parent, state: C.EditorState.create({ doc, extensions: [
    C.basicSetup, C.oneDark, C.EditorState.readOnly.of(true), C.EditorView.editable.of(false),
    ...(lang ? [C.StreamLanguage.define(C.oCaml)] : []),
  ] }) });
}

function renderResults() {
  const st = state[current];
  const box = document.getElementById("results");
  if (!st.results) { box.innerHTML = ""; return; }
  const r = st.results;
  let html = "";
  if (r.score) {
    const pct = r.score.total ? Math.round(100 * r.score.pass / r.score.total) : 0;
    html += `<div class="score"><span class="big">${r.score.pass}/${r.score.total}</span>
      <div class="bar"><div style="width:${pct}%"></div></div><span>${pct}%</span></div>`;
  }
  if (r.compile) html += `<h3>Compiler output</h3><pre class="out${r.compileErr ? " err" : ""}">${esc(r.compile)}</pre>`;
  if (r.tests && r.tests.length) {
    html += `<h3>Test cases</h3><table><tr><th></th><th>Expression</th><th>Expected type</th><th>Your type</th></tr>`;
    for (const t of r.tests) {
      html += `<tr class="${t.pass ? "pass" : "fail"}"><td class="st">${t.pass ? "✓" : "✗"}</td>
        <td class="m">${esc(t.desc)}</td><td class="m">${esc(t.expected)}</td><td class="m">${esc(t.got)}</td></tr>`;
    }
    html += `</table><p class="note">Types are compared up to renaming of type variables; the proof tree must also have the right subproofs.</p>`;
  }
  box.innerHTML = html;
}

async function loadUserCode(q, code) {
  // define a placeholder so a compile error leaves a clearly-failing function
  await ocaml(`open Common;;
let provided_cases = Solution.gather_case ${JSON.stringify(q.id)};;
let gather_exp_ty_substitution (_:type_env) (_:exp) (_:monoTy) : (proof * substitution) option =
  failwith "gather_exp_ty_substitution is not defined (did your code compile?)";;`, false);
  let src = code.trim();
  if (!src.endsWith(";;")) src += "\n;;";
  return ocaml(src, true);
}

let grading = false;
async function grade() {
  if (grading) return;
  saveEditor();
  const q = QUESTIONS.find(x => x.id === current);
  const st = state[q.id];
  const btn = document.getElementById("grade");
  grading = true; if (btn) { btn.disabled = true; btn.textContent = "Grading…"; }
  try {
    const compile = await loadUserCode(q, st.code);
    const compileErr = /(^|\n)Error:|Uncaught exception|@@TIMEOUT/.test(compile);
    let tests = [];
    if (compile !== "@@TIMEOUT") {
      const out = await ocaml(`Grader.run gather_exp_ty_substitution ${JSON.stringify(q.id)};;`, false, 15000);
      if (out === "@@TIMEOUT") {
        tests = [{ pass: false, desc: "(all tests)", expected: "", got: "Timed out after 15s: infinite loop?" }];
      } else {
        for (const line of out.split("\n")) {
          if (!line.startsWith("@@T\t")) continue;
          const [, s, desc, expected, got] = line.split("\t");
          tests.push({ pass: s === "PASS", desc, expected, got });
        }
        if (!tests.length) tests = [{ pass: false, desc: "(grader)", expected: "", got: out.trim().slice(0, 400) || "no output" }];
      }
    }
    const nTotal = (compile === "@@TIMEOUT" || !tests.length) ? 1 : tests.length;
    const score = { pass: tests.filter(t => t.pass).length, total: nTotal };
    const shownCompile = compile === "@@TIMEOUT" ? "Timed out while loading your code." : compile.trim();
    st.results = { compile: shownCompile, compileErr, tests, score };
    st.score = score;
    store.set("q:" + q.id, st);
  } finally {
    grading = false;
    if (current === q.id) { const b = document.getElementById("grade"); if (b) { b.disabled = false; b.textContent = "Save & Grade"; } renderResults(); }
    renderNav();
  }
}

async function runScratch() {
  saveEditor();
  const q = QUESTIONS.find(x => x.id === current);
  const outEl = document.getElementById("scratchOut");
  outEl.style.display = "block"; outEl.textContent = "Running…";
  const compile = await loadUserCode(q, state[q.id].code);
  let src = document.getElementById("scratch").value.trim();
  if (!src.endsWith(";;")) src += ";;";
  const out = await ocaml(src, true);
  const errPart = /(^|\n)Error:/.test(compile) ? "--- your code ---\n" + compile.trim() + "\n--- scratch ---\n" : "";
  outEl.textContent = errPart + (out === "@@TIMEOUT" ? "Timed out." : out);
}

let modalYes = null;
function confirmBox(text, onYes) {
  document.getElementById("modalText").textContent = text;
  modalYes = onYes;
  document.getElementById("modal").classList.add("show");
}
document.getElementById("modalYes").onclick = () => { document.getElementById("modal").classList.remove("show"); if (modalYes) modalYes(); };
document.getElementById("modalNo").onclick = () => document.getElementById("modal").classList.remove("show");

const wrapEl = document.querySelector(".wrap");
wrapEl.classList.toggle("collapsed", !!store.get("navCollapsed"));
document.getElementById("navToggle").onclick = () => store.set("navCollapsed", wrapEl.classList.toggle("collapsed"));

startWorker();
renderNav();
renderMain();
</script>
</body>
</html>
